name: CI Build & Test Multi-Platform

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build-and-test:
    name: ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}

    env:
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: "2G"

    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64
          - os: windows
            runner: windows-latest
            arch: x64
            msvc_arch: x64
            cmake_flags: ""
          # Windows x86 (32-bit)
          - os: windows
            runner: windows-latest
            arch: x86
            msvc_arch: amd64_x86
            cmake_flags: ""
          # Linux x64
          - os: linux
            runner: ubuntu-latest
            arch: x64
            msvc_arch: ""
            cmake_flags: ""
          # Linux x86 (32-bit)
          - os: linux
            runner: ubuntu-latest
            arch: x86
            msvc_arch: ""
            cmake_flags: '-DCMAKE_CXX_FLAGS="-m32" -DCMAKE_C_FLAGS="-m32"'
          # macOS x64 (Intel)
          - os: macos
            runner: macos-14
            arch: x64
            msvc_arch: ""
            cmake_flags: "-DCMAKE_OSX_ARCHITECTURES=x86_64"
          # macOS arm64 (Apple Silicon)
          - os: macos
            runner: macos-14
            arch: arm64
            msvc_arch: ""
            cmake_flags: "-DCMAKE_OSX_ARCHITECTURES=arm64"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Restore sccache Cache
        uses: actions/cache@v4
        with:
          path: .sccache
          key: sccache-${{ matrix.os }}-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: |
            sccache-${{ matrix.os }}-${{ matrix.arch }}-

      - name: Set up MSVC Developer Prompt (Windows)
        if: matrix.os == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Install Ninja (Linux)
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install 32-bit Multilib Dependencies (Linux x86)
        if: matrix.os == 'linux' && matrix.arch == 'x86'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y g++-multilib gcc-multilib

      - name: Optimize Windows Defender for Build Performance
        if: matrix.os == 'windows'
        shell: powershell
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          Add-MpPreference -ExclusionProcess "cl.exe", "link.exe", "cmake.exe", "ninja.exe", "sccache.exe"

      - name: Configure CMake
        shell: bash
        run: |
          cmake -B server/build -S server \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            ${{ matrix.cmake_flags }}

      - name: Build All Targets
        shell: bash
        run: cmake --build server/build --config Release

      - name: Run CTest Suite
        working-directory: server/build
        shell: bash
        run: ctest -C Release --output-on-failure --extra-verbose

      - name: Show sccache stats and stop server
        if: always()
        shell: bash
        run: |
          sccache --show-stats || true
          sccache --stop-server || true

      - name: Upload Server Binary
        uses: actions/upload-artifact@v4
        with:
          name: angel_lsp-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            server/build/Release/angel_lsp.exe
            server/build/Release/angel_lsp
            server/build/angel_lsp.exe
            server/build/angel_lsp
          if-no-files-found: warn
          retention-days: 14

  parity-audit:
    name: Parity against a real AngelScript compiler
    runs-on: ubuntu-latest

    env:
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: "2G"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Restore sccache Cache
        uses: actions/cache@v4
        with:
          path: .sccache
          key: sccache-parity-audit-${{ github.sha }}
          restore-keys: |
            sccache-parity-audit-

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Audit diagnostic codes
        working-directory: server
        run: python scripts/check-diagnostic-codes.py

      - name: Audit layer includes
        working-directory: server
        run: python scripts/check-layer-includes.py

      - name: Audit clean signatures
        working-directory: server
        run: python scripts/check-clean-signatures.py

      - name: Install pinned clang-format
        run: pip install clang-format==23.1.3

      - name: Verify code formatting
        working-directory: server
        run: python scripts/format-code.py --check

      - name: Configure CMake with the oracle
        run: |
          cmake -B server/build -S server \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DANGELLSP_BUILD_ORACLE=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Audit grammar names
        working-directory: server
        run: python scripts/check-grammar-names.py --strict

      - name: Audit the grammar pin
        working-directory: server
        run: python scripts/check-grammar-pin.py --strict

      - name: Audit client localisation
        working-directory: server
        run: python scripts/check-client-l10n.py

      - name: Build the oracle and the test suite
        run: cmake --build server/build --config Release --target angelscript_oracle angel_lsp_tests

      - name: Run the parity audit
        working-directory: server
        env:
          ASHARNESS_EXE: ${{ github.workspace }}/server/build/angelscript_oracle
          PARITY_PREDEFINED: ${{ github.workspace }}/server/tests/fixtures/sdk-addons.as.predefined
          PARITY_SCRIPT_DIR: ${{ github.workspace }}/server/tests/parity
        run: |
          set -o pipefail
          ./build/angel_lsp_tests --no-skip --test-case="*Parity*" 2>&1 | tee parity.log
          if ! grep -q "AngelScript parity audit (" parity.log; then
            echo "::error::The parity audit skipped itself - no summary line in its output."
            exit 1
          fi
          if grep -q "AngelScript parity audit (0 scripts)" parity.log; then
            echo "::error::The parity audit ran but found no scripts to audit."
            exit 1
          fi

      - name: Replay the typing scenarios
        working-directory: server
        run: |
          set -o pipefail
          ./build/angel_lsp_tests --test-case="Server - Diagnostics and hover survive*,Server - A message a typed*" 2>&1 | tee typing.log
          if ! grep -qE "test cases: +2 \| +2 passed" typing.log; then
            echo "::error::The typing scenarios did not both run and pass."
            exit 1
          fi

      - name: Show sccache stats and stop server
        if: always()
        run: |
          sccache --show-stats || true
          sccache --stop-server || true

  package-extension:
    name: Package VS Code extension
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        working-directory: client
        run: npm ci

      - name: Lint and Compile Client
        working-directory: client
        run: npm run pretest

      - name: Download Server Binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage Server Binaries
        shell: bash
        run: |
          set -euo pipefail
          for platform in windows-x64:win32-x64 windows-x86:win32-ia32 linux-x64:linux-x64 linux-x86:linux-ia32 macos-x64:darwin-x64 macos-arm64:darwin-arm64; do
            source_name="angel_lsp-${platform%%:*}"
            dest_dir="client/bin/${platform##*:}"
            [ -d "artifacts/$source_name" ] || continue
            mkdir -p "$dest_dir"
            find "artifacts/$source_name" -type f \( -name 'angel_lsp.exe' -o -name 'angel_lsp' \) -exec cp {} "$dest_dir/" \;
            chmod +x "$dest_dir"/angel_lsp 2>/dev/null || true
          done
          ls -R client/bin

      - name: Cache VS Code Test Binary
        uses: actions/cache@v4
        with:
          path: client/.vscode-test
          key: vscode-test-${{ runner.os }}-${{ hashFiles('client/.vscode-test.mjs', 'client/package.json') }}
          restore-keys: |
            vscode-test-${{ runner.os }}-

      - name: Test Client
        working-directory: client
        env:
          NODE_OPTIONS: "--dns-result-order=ipv4first"
        run: |
          for attempt in 1 2 3; do
            echo "::notice::Running client extension tests (attempt $attempt of 3)..."
            if xvfb-run -a npm test; then
              exit 0
            fi
            if [ $attempt -lt 3 ]; then
              echo "::warning::Client tests failed on attempt $attempt. Retrying in 10 seconds..."
              sleep 10
            fi
          done
          echo "::error::Client tests failed after 3 attempts."
          exit 1

      - name: Package Extension
        working-directory: client
        run: npx --yes @vscode/vsce package --out angelscript.vsix

      - name: Collect Release Assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp client/angelscript.vsix release-assets/
          for dir in client/bin/*/; do
            name="$(basename "$dir")"
            tar -czf "release-assets/angel_lsp-${name}.tar.gz" -C "$dir" .
          done
          ls -l release-assets

      - name: Upload Extension Package
        uses: actions/upload-artifact@v4
        with:
          name: angelscript-vsix
          path: client/angelscript.vsix
          retention-days: 14

      - name: Upload Release Assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release-assets/
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-and-test, parity-audit, package-extension]
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Release Assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release

      - name: Extract Release Notes from CHANGELOG.md
        run: |
          TAG="${{ github.ref_name }}"
          python server/scripts/extract-release-notes.py --tag "$TAG" --output release-notes.md || true

      - name: Publish Release to GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Creating release $TAG..."
            if [ -s release-notes.md ]; then
              gh release create "$TAG" --title "$TAG" --notes-file release-notes.md --verify-tag release/*
            else
              gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag release/*
            fi
          else
            echo "Release $TAG already exists, updating notes and assets..."
            if [ -s release-notes.md ]; then
              gh release edit "$TAG" --notes-file release-notes.md
            fi
            gh release upload "$TAG" release/* --clobber
          fi

          gh release edit "$TAG" --draft=false
