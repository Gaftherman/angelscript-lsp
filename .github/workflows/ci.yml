name: CI Build & Test Multi-Platform

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    name: ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64
          - os: windows
            runner: windows-latest
            arch: x64
            cmake_arch: -A x64
          # Windows x86 (32-bit)
          - os: windows
            runner: windows-latest
            arch: x86
            cmake_arch: -A Win32
          # Linux x64
          - os: linux
            runner: ubuntu-latest
            arch: x64
            cmake_arch: ""
          # Linux x86 (32-bit)
          - os: linux
            runner: ubuntu-latest
            arch: x86
            cmake_arch: ""
          # macOS x64 (Intel)
          - os: macos
            runner: macos-13
            arch: x64
            cmake_arch: ""
          # macOS arm64 (Apple Silicon)
          - os: macos
            runner: macos-14
            arch: arm64
            cmake_arch: ""

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Configure 32-bit Linux dependencies if applicable
      - name: Install 32-bit Multilib Dependencies (Linux x86)
        if: matrix.os == 'linux' && matrix.arch == 'x86'
        shell: bash
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y g++-multilib gcc-multilib

      # Configure CMake
      - name: Configure CMake
        shell: bash
        run: |
          cmake -B server/build -S server \
            -DCMAKE_BUILD_TYPE=Release \
            ${{ matrix.cmake_arch }} \
            ${{ matrix.os == 'linux' && matrix.arch == 'x86' && '-DCMAKE_CXX_FLAGS="-m32" -DCMAKE_C_FLAGS="-m32"' || '' }}

      # Build the entire project and test executables
      - name: Build All Targets
        shell: bash
        run: cmake --build server/build --config Release -j 4

      # Run the complete test suite
      - name: Run CTest Suite
        working-directory: server/build
        shell: bash
        run: ctest -C Release --output-on-failure --extra-verbose

      # The server binary is what the extension ships, so keep every platform's build reachable
      # from the run that produced and tested it.
      - name: Upload Server Binary
        uses: actions/upload-artifact@v4
        with:
          name: angel_lsp-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            server/build/Release/angel_lsp*
            server/build/angel_lsp
          if-no-files-found: warn
          retention-days: 14

  # The only check that compares this analyzer against the actual language rather than against its
  # own expectations. It used to need a binary from an unpublished repository, so it ran on one
  # developer's machine and a regression could land here green; server/tools/oracle builds a real
  # AngelScript compiler from source instead, which means this can gate.
  #
  # One platform is enough: the question is what the language accepts, and that does not vary by
  # host. Linux is the cheapest place to ask it.
  parity-audit:
    name: Parity against a real AngelScript compiler
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Cheap, and it catches a class of drift nothing else does: a diagnostic message left behind
      # by a rule that no longer fires, or a rule emitting a code the message table has no entry for.
      - name: Audit diagnostic codes
        working-directory: server
        run: python scripts/check-diagnostic-codes.py

      - name: Configure CMake with the oracle
        run: cmake -B server/build -S server -DCMAKE_BUILD_TYPE=Release -DANGELLSP_BUILD_ORACLE=ON

      - name: Build the oracle and the test suite
        run: cmake --build server/build --config Release --target angelscript_oracle angel_lsp_tests -j 4

      - name: Run the parity audit
        working-directory: server
        env:
          # The oracle and the stub are a pair - sdk-addons.as.predefined describes exactly what
          # tools/oracle/main.cpp registers. Running against any other stub reports the mismatch
          # rather than anything about the analyzer.
          ASHARNESS_EXE: ${{ github.workspace }}/server/build/angelscript_oracle
          PARITY_PREDEFINED: ${{ github.workspace }}/server/tests/fixtures/sdk-addons.as.predefined
          PARITY_SCRIPT_DIR: ${{ github.workspace }}/server/tests/parity
        run: ./build/angel_lsp_tests --no-skip --test-case="*Parity*"

  package-extension:
    name: Package VS Code extension
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        working-directory: client
        run: npm ci

      - name: Lint and Compile Client
        working-directory: client
        run: npm run pretest

      # Downloaded into the layout getServerPath() expects, so the packaged extension carries a
      # server for every platform the matrix above built.
      - name: Download Server Binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage Server Binaries
        shell: bash
        run: |
          set -euo pipefail
          for platform in windows-x64:win32-x64 windows-x86:win32-ia32 linux-x64:linux-x64 linux-x86:linux-ia32 macos-x64:darwin-x64 macos-arm64:darwin-arm64; do
            source_name="angel_lsp-${platform%%:*}"
            dest_dir="client/bin/${platform##*:}"
            [ -d "artifacts/$source_name" ] || continue
            mkdir -p "$dest_dir"
            find "artifacts/$source_name" -type f \( -name 'angel_lsp*' -o -name 'angel_lsp' \) -exec cp {} "$dest_dir/" \;
            chmod +x "$dest_dir"/angel_lsp 2>/dev/null || true
          done
          ls -R client/bin

      # Packaged, not published: releasing is a deliberate act, and this only proves the extension
      # is in a publishable state on every commit.
      # Dependencies are deliberately bundled: the client is compiled by plain tsc with no bundler,
      # so vscode-languageclient has to travel inside the .vsix or the extension fails to activate.
      - name: Package Extension
        working-directory: client
        run: npx --yes @vscode/vsce package --out angelscript-lsp.vsix

      - name: Upload Extension Package
        uses: actions/upload-artifact@v4
        with:
          name: angelscript-lsp-vsix
          path: client/angelscript-lsp.vsix
          retention-days: 14
