# Builds the server for every supported platform and attaches the results to a GitHub release.
#
# This exists because the compiled server used to be committed: two 8 MB executables in
# client/bin, rewritten by every build, so every server change arrived as an unreviewable binary
# diff and the repository carried a copy that nobody could verify came from the source beside it.
# CI already rebuilt all six targets on every push; nothing published them, so the committed
# copies were the only ones anyone could get hold of. This closes that gap, and the binaries are
# now ignored by git.
#
# Triggered by a version tag, or by hand from the Actions tab when a build is wanted without one.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish the release under (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-server:
    name: Build server - ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}

    # Kept in step with the matrix in ci.yml. A platform added there and forgotten here would
    # produce a release whose extension silently has no server for it.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-latest
            arch: x64
            cmake_arch: -A x64
          - os: windows
            runner: windows-latest
            arch: x86
            cmake_arch: -A Win32
          - os: linux
            runner: ubuntu-latest
            arch: x64
            cmake_arch: ""
          - os: linux
            runner: ubuntu-latest
            arch: x86
            cmake_arch: ""
          # macOS x64 (Intel)
          - os: macos
            runner: macos-14
            arch: x64
            cmake_arch: "-DCMAKE_OSX_ARCHITECTURES=x86_64"
          # macOS arm64 (Apple Silicon)
          - os: macos
            runner: macos-14
            arch: arm64
            cmake_arch: "-DCMAKE_OSX_ARCHITECTURES=arm64"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install 32-bit Multilib Dependencies (Linux x86)
        if: matrix.os == 'linux' && matrix.arch == 'x86'
        shell: bash
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y g++-multilib gcc-multilib

      - name: Configure CMake
        shell: bash
        run: |
          cmake -B server/build -S server \
            -DCMAKE_BUILD_TYPE=Release \
            ${{ matrix.cmake_arch }} \
            ${{ matrix.os == 'linux' && matrix.arch == 'x86' && '-DCMAKE_CXX_FLAGS="-m32" -DCMAKE_C_FLAGS="-m32"' || '' }}

      - name: Build All Targets
        shell: bash
        run: cmake --build server/build --config Release -j 4

      # A release must not ship a server that fails its own suite. This is the gate, not a
      # formality: the build above succeeding says nothing about whether the analyzer is correct.
      - name: Run CTest Suite
        working-directory: server/build
        shell: bash
        run: ctest -C Release --output-on-failure --parallel 4

      - name: Upload Server Binary
        uses: actions/upload-artifact@v4
        with:
          name: angel_lsp-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            server/build/Release/angel_lsp*
            server/build/angel_lsp
          if-no-files-found: error

  # The only quality gate this workflow originally had was ctest, but the parity audit against
  # the real AngelScript compiler is marked doctest::skip(true) so that normal test runs do not
  # execute it. Without this gate, a release could be published with broken language parity
  # undetected. This replicates the parity audit performed by ci.yml on every push, ensuring the
  # check gates the release at the moment when it matters most.
  parity-gate:
    name: Parity gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Cheap, and it catches a class of drift nothing else does: a diagnostic message left behind
      # by a rule that no longer fires, or a rule emitting a code the message table has no entry for.
      - name: Audit diagnostic codes
        working-directory: server
        run: python scripts/check-diagnostic-codes.py

      # One #include is all it takes to put the whole protocol library back into every translation
      # unit in analysis/, and nothing else would say so: the build stays green and the coupling is
      # invisible until someone reads the transitive include tree by hand.
      - name: Audit layer includes
        working-directory: server
        run: python scripts/check-layer-includes.py

      - name: Configure CMake with the oracle
        run: cmake -B server/build -S server -DCMAKE_BUILD_TYPE=Release -DANGELLSP_BUILD_ORACLE=ON

      - name: Build the oracle and the test suite
        run: cmake --build server/build --config Release --target angelscript_oracle angel_lsp_tests -j 4

      - name: Run the parity audit
        working-directory: server
        env:
          # The oracle and the stub are a pair - sdk-addons.as.predefined describes exactly what
          # tools/oracle/main.cpp registers. Running against any other stub reports the mismatch
          # rather than anything about the analyzer.
          ASHARNESS_EXE: ${{ github.workspace }}/server/build/angelscript_oracle
          PARITY_PREDEFINED: ${{ github.workspace }}/server/tests/fixtures/sdk-addons.as.predefined
          PARITY_SCRIPT_DIR: ${{ github.workspace }}/server/tests/parity
        # The audit skips itself when it cannot find a corpus, and for a long while it did exactly
        # that here - silently, with this job green. Requiring its own summary line in the output is
        # what turns a skip back into a failure, and it costs one grep.
        run: |
          set -o pipefail
          ./build/angel_lsp_tests --no-skip --test-case="*Parity*" 2>&1 | tee parity.log
          if ! grep -q "AngelScript parity audit (" parity.log; then
            echo "::error::The parity audit skipped itself - no summary line in its output."
            exit 1
          fi
          if grep -q "AngelScript parity audit (0 scripts)" parity.log; then
            echo "::error::The parity audit ran but found no scripts to audit."
            exit 1
          fi

  publish:
    name: Package and publish release
    runs-on: ubuntu-latest
    needs: [build-server, parity-gate]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        working-directory: client
        run: npm ci

      - name: Lint and Compile Client
        working-directory: client
        run: npm run pretest

      - name: Download Server Binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Staged into the layout getServerPath() expects: bin/${os.platform()}-${os.arch()}. The
      # mapping is from the matrix's names to Node's, which are not the same words.
      - name: Stage Server Binaries
        shell: bash
        run: |
          set -euo pipefail
          for platform in windows-x64:win32-x64 windows-x86:win32-ia32 linux-x64:linux-x64 linux-x86:linux-ia32 macos-x64:darwin-x64 macos-arm64:darwin-arm64; do
            source_name="angel_lsp-${platform%%:*}"
            dest_dir="client/bin/${platform##*:}"
            if [ ! -d "artifacts/$source_name" ]; then
              echo "::error::Missing server build for ${platform%%:*}; refusing to publish a partial release."
              exit 1
            fi
            mkdir -p "$dest_dir"
            find "artifacts/$source_name" -type f \( -name 'angel_lsp*' -o -name 'angel_lsp' \) -exec cp {} "$dest_dir/" \;
            chmod +x "$dest_dir"/angel_lsp 2>/dev/null || true
          done
          ls -R client/bin

      - name: Package Extension
        working-directory: client
        run: npx --yes @vscode/vsce package --out angelscript-lsp.vsix

      # Each platform's server is attached alongside the .vsix so a host embedding the server
      # directly - without the VS Code extension - has something to download.
      - name: Collect Release Assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp client/angelscript-lsp.vsix release/
          for dir in client/bin/*/; do
            name="$(basename "$dir")"
            tar -czf "release/angel_lsp-${name}.tar.gz" -C "$dir" .
          done
          ls -l release

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
