# Read by SonarCloud Automatic Analysis (sonar-project.properties is only read by a CI scanner).
# Analyze the shipped server and client sources. Tests, test fixtures and developer scripts are out of scope.
sonar.sources=server/src,client/src
sonar.exclusions=server/tests/**,client/src/test/**,client/test-fixtures/**,**/build/**,**/node_modules/**,client/out/**,client/dist/**
